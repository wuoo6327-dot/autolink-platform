title = "AUTOLINK source and history secrets review"

[extend]
useDefault = true

# Do not allowlist .env, frontend bundles, sample configs or all test files.
[[allowlists]]
description = "Generated scanner output/cache and Git internals only"
paths = [
  '''(^|/)(security-reports|\.security-cache|__pycache__|\.git)(/|$)'''
]

[[rules]]
id = "autolink-code-signing-secret"
description = "Hardcoded AUTOLINK email-code signing secret"
regex = '''(?i)auth_code_secret\s*[:=]\s*["']?([A-Za-z0-9_+/.=-]{20,})'''
secretGroup = 1
entropy = 3.0
keywords = ["auth_code_secret"]


# Audited round5 metadata false positives, never credentials.
# SHA256(auth/email_auth.py) and SHA256(auth/Dockerfile), independently recomputed.
# Keep the initial fae1a371 commit in history; do not rewrite it to hide findings.
# Each allowlist has exactly one verified digest. Combining them under AND
# would require one finding to contain both digests, so neither was excluded.
[[allowlists]]
description = "Verified email_auth.py SHA256 in round5 release-lock metadata"
condition = "AND"
paths = ['''(^|/)release-lock\.json$''']
regexTarget = "secret"
regexes = ['''^ff33ff6a032377bdebaee6b1c03824ac073d936047bb4bb1ae12e2f5e923710b$''']

[[allowlists]]
description = "Verified auth Dockerfile SHA256 in round5 release-lock metadata"
condition = "AND"
paths = ['''(^|/)release-lock\.json$''']
regexTarget = "secret"
regexes = ['''^290e4897140dd11a130921039038465c5305500c576764065565f53d1714ea4a$''']

[[allowlists]]
description = "Published round13 isolated test image tag is not an API credential"
condition = "AND"
paths = ['''(^|/)AUTOLINK_Stripe真实测试与支付上线准备完成报告\.md$''']
regexTarget = "match"
regexes = ['''^autolink-auth:round13-2aa4f32-isolated`$''']

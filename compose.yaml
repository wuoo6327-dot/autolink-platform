name: autolink-demo
services:
  auth:
    image: ${AUTOLINK_AUTH_IMAGE:?Use the approved round5 digest from release-lock.json}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    environment:
      GOOGLE_CLIENT_ID: 919734262669-4csunht5tjcdlj2oojcilidn4utpfskl.apps.googleusercontent.com
      AUTH_DB_PATH: /data/autolink-auth.sqlite3
      MEMBERSHIP_RESTRICTIONS: "true"
      PLATFORM_ADMIN_EMAIL: wuoo6327@gmail.com
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_CODE_SECRET: ${AUTH_CODE_SECRET:-}
      APP_URL: ${APP_URL:-https://autolinkglobal.com}
      PAYMENTS_ENV: ${PAYMENTS_ENV:-}
      STRIPE_LIVE_RELEASE_READY: ${STRIPE_LIVE_RELEASE_READY:-false}
      STRIPE_CARD_ENABLED: ${STRIPE_CARD_ENABLED:-false}
      STRIPE_SUPPLIER_LISTING_ENABLED: ${STRIPE_SUPPLIER_LISTING_ENABLED:-false}
      STRIPE_ACCOUNT_ID: ${STRIPE_ACCOUNT_ID:-}
      STRIPE_PAYMENT_METHOD_CONFIGURATION: ${STRIPE_PAYMENT_METHOD_CONFIGURATION:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUPPLIER_WEBHOOK_SECRET: ${STRIPE_SUPPLIER_WEBHOOK_SECRET:-}
    volumes:
      - auth_data:/data
      - ./site:/srv:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    image: autolink-round3-caddy@sha256:bddc55c35abafbc75c8a765ac79991f221c9149fa943bf960217d50cf70323fb
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
  auth_data:
